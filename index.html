<!DOCTYPE html>
<html lang="vi" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Prompt Vault">
  <title>Hệ Thống Quản Lý Prompt Trang Phục Thông Minh (Cloud Sync)</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase SDK (Modular v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ==========================================
    // CẤU HÌNH FIREBASE CỦA BẠN (Dùng chung project)
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyD6SZKedd9pjqk67_b37QHOjXUnPgzslvc",
      authDomain: "prompt-clothes.firebaseapp.com",
      projectId: "prompt-clothes",
      storageBucket: "prompt-clothes.firebasestorage.app",
      messagingSenderId: "1094881159260",
      appId: "1:1094881159260:web:80d49982505b16dd991e99"
    };

    let db = null;
    let isCloudEnabled = false;

    try {
      if (firebaseConfig.projectId && firebaseConfig.projectId !== "YOUR_PROJECT_ID") {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        isCloudEnabled = true;
        console.log("Đã kết nối Firebase Firestore thành công!");
      }
    } catch (e) {
      console.warn("Chưa cấu hình Firebase hoặc lỗi kết nối, chuyển về LocalStorage:", e);
    }

    let allPrompts = [];
    let currentFilteredPrompts = [];
    let currentPage = 1;
    const itemsPerPage = 9;
    let selectedTag = '';
    let isFavFilterActive = false;
    let isTagExpanded = false; // Trạng thái mở rộng danh sách tag

    // Danh sách quy tắc từ khóa -> Thẻ Tag tự động
    const keywordTagRules = [
      { tag: "quần tất nhũ trắng", keywords: ["shimmer tights", "glitter pantyhose", "sparkling hosiery", "quần tất nhũ", "ánh nhũ kim tuyến"] },
      { tag: "quần tất lưới", keywords: ["fishnet", "mesh tights", "quần tất lưới", "lưới mắt kim cương"] },
      { tag: "quần tất đen", keywords: ["black tights", "black pantyhose", "black stockings", "quần tất đen"] },
      { tag: "quần tất trắng", keywords: ["white tights", "white pantyhose", "white stockings", "quần tất trắng"] },
      { tag: "quần tất", keywords: ["tights", "pantyhose", "stockings", "quần tất"] },
      { tag: "váy ngắn", keywords: ["short skirt", "miniskirt", "mini skirt", "váy ngắn"] },
      { tag: "crocs", keywords: ["crocs", "clogs"] },
      { tag: "nữ sinh", keywords: ["schoolgirl", "school girl", "student girl", "nữ sinh"] },
      { tag: "chất liệu ren", keywords: ["lace", "lacy", "chất liệu ren", "ren"] },
      { tag: "công sở", keywords: ["office", "workwear", "businesswear", "công sở"] },
      { tag: "chân váy", keywords: ["skirt", "chân váy"] },
      { tag: "váy xếp ly", keywords: ["pleated skirt", "pleated", "váy xếp ly"] },
      { tag: "sơ mi", keywords: ["shirt", "blouse", "button-down", "sơ mi"] },
      { tag: "đồng phục", keywords: ["uniform", "school uniform", "đồng phục"] },
      { tag: "crop top", keywords: ["crop top", "croptop"] },
      { tag: "áo phông", keywords: ["t-shirt", "tshirt", "tee", "áo phông"] }
    ];

    const defaultPrompts = [
      { 
        id: '1', 
        shortDesc: 'Quần tất màu da ánh nhũ kim tuyến lấp lánh', 
        fullPrompt: 'PROMPT QUẦN TẤT MÀU DA ÁNH NHŨ KIM TUYẾN LẤP LÁNH...', 
        tags: ['quần tất nhũ trắng', 'quần tất'], 
        favorite: true 
      }
    ];

    async function initApp() {
      const syncStatusEl = document.getElementById('sync-status');
      
      if (isCloudEnabled && db) {
        if (syncStatusEl) syncStatusEl.innerText = "Trạng thái: Đã đồng bộ Cloud Realtime";
        
        onSnapshot(collection(db, "prompts"), (snapshot) => {
          allPrompts = [];
          snapshot.forEach((docSnap) => {
            allPrompts.push({ id: docSnap.id, ...docSnap.data() });
          });
          
          if (allPrompts.length === 0) {
            defaultPrompts.forEach(async (p) => {
              await setDoc(doc(db, "prompts", p.id), p);
            });
          } else {
            handleSearchOrFilter();
          }
        }, (error) => {
          console.error("Lỗi lắng nghe dữ liệu:", error);
          if (syncStatusEl) syncStatusEl.innerText = "Trạng thái: Chế độ Offline (Local)";
          loadFromLocal();
        });
      } else {
        if (syncStatusEl) syncStatusEl.innerText = "Trạng thái: Chế độ Offline (LocalStorage)";
        loadFromLocal();
      }
    }

    function loadFromLocal() {
      const saved = localStorage.getItem('prompt_vault_data');
      allPrompts = saved ? JSON.parse(saved) : defaultPrompts;
      handleSearchOrFilter();
    }

    // Tự động gợi ý thẻ tag khi nhập prompt, không tự động điền tiêu đề nữa
    window.handlePromptInput = function() {
      const fullText = document.getElementById('form-full-prompt').value.toLowerCase();
      
      const detectedTags = new Set();
      keywordTagRules.forEach(rule => {
        if (rule.keywords.some(kw => fullText.includes(kw))) {
          detectedTags.add(rule.tag);
        }
      });

      if (detectedTags.size > 0 && !document.getElementById('form-tags').value) {
        document.getElementById('form-tags').value = Array.from(detectedTags).join(', ');
      }
    };

    window.savePromptToDB = async function(promptData) {
      if (isCloudEnabled && db) {
        try {
          if (promptData.id) {
            const docRef = doc(db, "prompts", String(promptData.id));
            await updateDoc(docRef, promptData);
          } else {
            promptData.id = Date.now().toString();
            await setDoc(doc(db, "prompts", promptData.id), promptData);
          }
          showToast("Đã lưu và đồng bộ lên Cloud!");
        } catch (e) {
          console.error("Lỗi ghi Firestore:", e);
          saveToLocalFallback(promptData);
        }
      } else {
        saveToLocalFallback(promptData);
      }
    };

    function saveToLocalFallback(promptData) {
      if (!promptData.id) promptData.id = Date.now().toString();
      const index = allPrompts.findIndex(p => p.id === promptData.id);
      if (index >= 0) allPrompts[index] = promptData;
      else allPrompts.unshift(promptData);
      localStorage.setItem('prompt_vault_data', JSON.stringify(allPrompts));
      handleSearchOrFilter();
      showToast("Đã lưu vào bộ nhớ cục bộ!");
    }

    window.deletePromptFromDB = async function(id) {
      if (confirm('Bạn có chắc chắn muốn xóa prompt này không?')) {
        if (isCloudEnabled && db) {
          try {
            await deleteDoc(doc(db, "prompts", String(id)));
            showToast("Đã xóa thành công!");
          } catch (e) { console.error("Lỗi xóa Cloud:", e); }
        } else {
          allPrompts = allPrompts.filter(p => p.id !== id);
          localStorage.setItem('prompt_vault_data', JSON.stringify(allPrompts));
          handleSearchOrFilter();
          showToast("Đã xóa khỏi thiết bị!");
        }
      }
    };

    window.toggleFavoriteDB = async function(id) {
      const p = allPrompts.find(item => item.id === id);
      if (p) {
        p.favorite = !p.favorite;
        if (isCloudEnabled && db) {
          try {
            await updateDoc(doc(db, "prompts", String(id)), { favorite: p.favorite });
          } catch (e) { console.error("Lỗi favorite:", e); }
        } else {
          localStorage.setItem('prompt_vault_data', JSON.stringify(allPrompts));
        }
        handleSearchOrFilter();
      }
    };

    window.handleSearchOrFilter = function() {
      const keyword = (document.getElementById('search-input')?.value || '').toLowerCase();
      
      currentFilteredPrompts = allPrompts.filter(p => {
        const matchKeyword = p.shortDesc.toLowerCase().includes(keyword) || p.fullPrompt.toLowerCase().includes(keyword) || (p.tags && p.tags.some(t => t.toLowerCase().includes(keyword)));
        const matchTag = selectedTag ? (p.tags && p.tags.includes(selectedTag)) : true;
        const matchFav = isFavFilterActive ? p.favorite : true;
        return matchKeyword && matchTag && matchFav;
      });

      renderTagsCloud();
      renderPrompts();
      renderPagination();
      updateCounts();
    };

    function renderTagsCloud() {
      const tagCloudEl = document.getElementById('tag-cloud');
      if (!tagCloudEl) return;
      
      const tagCounts = {};
      allPrompts.forEach(p => {
        if (p.tags) {
          p.tags.forEach(t => { tagCounts[t] = (tagCounts[t] || 0) + 1; });
        }
      });

      let tagsArray = Object.entries(tagCounts);
      let html = '';

      tagsArray.forEach(([tag, count]) => {
        const active = selectedTag === tag ? 'bg-indigo-600 text-white border-indigo-500' : 'bg-slate-900/90 text-slate-300 border-slate-700/75 hover:bg-slate-800';
        html += `<button onclick="filterByTag('${tag}')" class="shrink-0 px-2.5 py-1.5 rounded-xl text-xs font-semibold border transition ${active}">${tag} (${count})</button>`;
      });

      tagCloudEl.innerHTML = html;

      // Xử lý ẩn hiện phần mở rộng dòng dưới nếu có nút Xem thêm
      const tagWrapper = document.getElementById('tag-wrapper');
      if (tagWrapper) {
        if (isTagExpanded) {
          tagWrapper.classList.remove('max-h-[42px]', 'overflow-hidden');
          tagWrapper.classList.add('flex-wrap');
        } else {
          tagWrapper.classList.add('max-h-[42px]', 'overflow-hidden');
          tagWrapper.classList.remove('flex-wrap');
        }
      }

      const expandBtn = document.getElementById('tag-expand-btn');
      if (expandBtn) {
        if (tagsArray.length > 3) {
          expandBtn.classList.remove('hidden');
          expandBtn.innerText = isTagExpanded ? '▲ Thu gọn' : '▼ Xem thêm';
        } else {
          expandBtn.classList.add('hidden');
        }
      }
    }

    window.toggleTagExpand = function() {
      isTagExpanded = !isTagExpanded;
      renderTagsCloud();
    };

    window.filterByTag = function(tag) {
      selectedTag = selectedTag === tag ? '' : tag;
      currentPage = 1;
      handleSearchOrFilter();
    };

    window.toggleFavoriteFilter = function() {
      isFavFilterActive = !isFavFilterActive;
      const btn = document.getElementById('btn-filter-fav');
      if (btn) {
        if (isFavFilterActive) {
          btn.className = "shrink-0 px-3 py-1.5 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 bg-rose-600 text-white border-rose-500 shadow-lg shadow-rose-600/25";
        } else {
          btn.className = "shrink-0 px-3 py-1.5 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 bg-slate-900/90 text-slate-300 border border-slate-700/75";
        }
      }
      currentPage = 1;
      handleSearchOrFilter();
    };

    window.clearFilters = function() {
      selectedTag = '';
      isFavFilterActive = false;
      if (document.getElementById('search-input')) document.getElementById('search-input').value = '';
      const btn = document.getElementById('btn-filter-fav');
      if (btn) btn.className = "shrink-0 px-3 py-1.5 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 bg-slate-900/90 text-slate-300 border border-slate-700/75";
      currentPage = 1;
      handleSearchOrFilter();
    };

    function updateCounts() {
      const countEl = document.getElementById('prompt-count');
      if (countEl) countEl.innerText = `Hiển thị ${currentFilteredPrompts.length} / ${allPrompts.length} prompt`;
      
      const favCount = allPrompts.filter(p => p.favorite).length;
      const favBadge = document.getElementById('fav-count-badge');
      if (favBadge) favBadge.innerText = favCount;
    }

    function renderPrompts() {
      const grid = document.getElementById('prompt-grid');
      const emptyState = document.getElementById('empty-state');
      if (!grid) return;

      if (currentFilteredPrompts.length === 0) {
        grid.innerHTML = '';
        if (emptyState) emptyState.classList.remove('hidden');
        return;
      }
      if (emptyState) emptyState.classList.add('hidden');

      const start = (currentPage - 1) * itemsPerPage;
      const paginated = currentFilteredPrompts.slice(start, start + itemsPerPage);

      let html = '';
      paginated.forEach(p => {
        const tagsHtml = (p.tags || []).map(t => `<span class="bg-slate-800 text-indigo-300 text-[10px] font-medium px-2 py-0.5 rounded-md border border-slate-700">#${t}</span>`).join('');
        const favColor = p.favorite ? 'text-rose-500 fill-rose-500' : 'text-slate-400 hover:text-rose-500';
        
        html += `
          <div class="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-4 flex flex-col justify-between shadow-lg relative group">
            <div class="space-y-2.5">
              <div class="flex items-start justify-between gap-2">
                <h3 class="font-bold text-sm text-slate-100 line-clamp-1">${escapeHtml(p.shortDesc)}</h3>
                <div class="flex items-center gap-1">
                  <button onclick="toggleFavoriteDB('${p.id}')" class="p-1.5 rounded-lg hover:bg-slate-700/60 transition"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${favColor}"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg></button>
                  <button onclick="editPrompt('${p.id}')" class="p-1.5 rounded-lg hover:bg-slate-700/60 text-slate-400 hover:text-indigo-400 transition"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></button>
                  <button onclick="deletePromptFromDB('${p.id}')" class="p-1.5 rounded-lg hover:bg-slate-700/60 text-slate-400 hover:text-rose-400 transition"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg></button>
                </div>
              </div>
              <div class="bg-slate-950/60 p-2.5 rounded-xl border border-slate-900 font-mono text-xs text-slate-300 max-h-24 overflow-y-auto select-all">${escapeHtml(p.fullPrompt)}</div>
              <div class="flex flex-wrap gap-1 pt-1">${tagsHtml}</div>
            </div>
            <div class="pt-3 mt-3 border-t border-slate-700/50 flex items-center justify-between">
              <button onclick="copyToClipboard('${escapeJs(p.fullPrompt)}')" class="w-full bg-indigo-600/20 hover:bg-indigo-600 text-indigo-300 hover:text-white text-xs font-semibold py-2 rounded-xl border border-indigo-500/30 transition flex items-center justify-center gap-1.5">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                <span>Sao chép Prompt</span>
              </button>
            </div>
          </div>
        `;
      });
      grid.innerHTML = html;
    }

    function renderPagination() {
      const container = document.getElementById('pagination-container');
      if (!container) return;
      const totalPages = Math.ceil(currentFilteredPrompts.length / itemsPerPage);
      if (totalPages <= 1) { container.innerHTML = ''; return; }

      let html = '';
      for (let i = 1; i <= totalPages; i++) {
        const active = i === currentPage ? 'bg-indigo-600 text-white border-indigo-500' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700';
        html += `<button onclick="changePage(${i})" class="w-8 h-8 rounded-xl text-xs font-semibold border ${active} transition">${i}</button>`;
      }
      container.innerHTML = html;
    }

    window.changePage = function(page) {
      currentPage = page;
      renderPrompts();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.openModal = function(id = null) {
      document.getElementById('prompt-modal').classList.remove('hidden');
      if (id) {
        document.getElementById('modal-title').innerText = 'Chỉnh Sửa Prompt';
        const p = allPrompts.find(item => item.id === id);
        if (p) {
          document.getElementById('prompt-id').value = p.id;
          document.getElementById('form-full-prompt').value = p.fullPrompt;
          document.getElementById('form-short-desc').value = p.shortDesc;
          document.getElementById('form-tags').value = (p.tags || []).join(', ');
        }
      } else {
        document.getElementById('modal-title').innerText = 'Thêm Prompt Mới';
        document.getElementById('prompt-form').reset();
        document.getElementById('prompt-id').value = '';
      }
    };

    window.closeModal = function() {
      document.getElementById('prompt-modal').classList.add('hidden');
    };

    window.editPrompt = function(id) { openModal(id); };

    window.savePrompt = async function(e) {
      e.preventDefault();
      const id = document.getElementById('prompt-id').value;
      const fullPrompt = document.getElementById('form-full-prompt').value;
      const shortDesc = document.getElementById('form-short-desc').value; // Thủ công
      const rawTags = document.getElementById('form-tags').value;
      const tags = rawTags ? rawTags.split(',').map(t => t.trim().toLowerCase()).filter(t => t) : ['fashion'];

      const existing = allPrompts.find(p => p.id === id);
      const promptData = {
        id: id || null,
        fullPrompt,
        shortDesc,
        tags,
        favorite: existing ? existing.favorite : false
      };

      await window.savePromptToDB(promptData);
      closeModal();
    };

    window.copyToClipboard = function(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast("Đã sao chép prompt!");
      });
    };

    window.copyQuanTatNhuTrangPrompt = function() {
      const targetText = `PROMPT QUẦN TẤT MÀU DA ÁNH NHŨ KIM TUYẾN LẤP LÁNH

Một đôi quần tất nữ màu da nude hồng nhạt, chất liệu nylon pha spandex co giãn cao cấp, thiết kế ôm sát chân với hiệu ứng ánh nhũ kim tuyến siêu nhỏ lấp lánh trên toàn bộ bề mặt. Phong cách sheer glitter pantyhose, ultra-fine shimmer tights, delicate sparkling hosiery.

Màu sắc và độ xuyên thấu

2. Hiệu ứng kim tuyến đặc trưng

Toàn bộ bề mặt quần tất được phủ các hạt nhũ siêu nhỏ, cực kỳ mịn và phân bố dày đặc.
Các hạt glitter có kích thước rất nhỏ, tương tự bụi kim tuyến hoặc các tinh thể ánh sáng li ti.
Hạt nhũ chủ yếu có màu trắng bạc, kết hợp ánh phản chiếu xanh băng nhạt, hồng phấn và champagne rất nhẹ.
Các hạt lấp lánh xuất hiện dưới dạng những điểm sáng nhỏ li ti, không phải các hạt kim tuyến lớn hoặc mảnh sequins.
Hiệu ứng nhũ được phân bố đều từ đùi xuống bắp chân, mắt cá và bàn chân.
Khi ánh sáng chiếu trực tiếp, các hạt nhũ tạo thành vô số điểm sáng nhỏ, giống như lớp bụi sao phủ trên nền vải màu da.
Khi ánh sáng yếu, kim tuyến trở nên dịu hơn, hòa vào màu nude hồng của lớp tất.
Hiệu ứng lấp lánh rõ ràng nhưng vẫn giữ được độ trong mờ tự nhiên của chất liệu.
3. Chất liệu và kết cấu vải

Chất liệu nylon pha spandex hoặc elastane cao cấp, sợi dệt mịn, mềm và đàn hồi tốt.
Bề mặt vải mượt, mỏng, ôm sát da, có độ bóng satin rất nhẹ.
Chất liệu không dày như quần legging, không có bề mặt nhám hoặc lưới mắt lớn.
Các sợi vải được dệt đều, tạo kết cấu tinh tế và tự nhiên.

      <div id="prompt-count">Đang tải dữ liệu...</div>
    </div>

    <div id="prompt-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5"></div>
    <div id="pagination-container" class="flex justify-center items-center gap-1.5 sm:gap-2 pt-4 pb-6"></div>

    <div id="empty-state" class="hidden text-center py-12 sm:py-16 bg-slate-800/30 rounded-2xl border border-dashed border-slate-700">
      <h3 class="text-sm sm:text-base font-semibold text-slate-300">Không tìm thấy Prompt nào</h3>
    </div>
  </main>

  <!-- Modal Form -->
  <div id="prompt-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4 overflow-y-auto hidden">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-2xl shadow-2xl overflow-hidden max-h-[85vh] flex flex-col my-auto">
      <div class="flex items-center justify-between px-5 py-4 border-b border-slate-800 bg-slate-900/50 shrink-0">
        <h2 id="modal-title" class="text-base sm:text-lg font-bold text-slate-100">Thêm Prompt Mới</h2>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-200 p-1">✕</button>
      </div>
      <form id="prompt-form" onsubmit="savePrompt(event)" class="p-4 sm:p-6 space-y-4 overflow-y-auto flex-1">
        <input type="hidden" id="prompt-id" value="">
        <div class="space-y-1.5">
          <label class="block text-xs sm:text-sm font-semibold text-slate-200">Tiêu đề / Mô tả ngắn trang phục (Nhập thủ công) *</label>
          <input type="text" id="form-short-desc" required class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-xs sm:text-sm text-slate-100" placeholder="Nhập tiêu đề hoặc mô tả ngắn...">
        </div>
        <div class="space-y-1.5">
          <label class="block text-xs sm:text-sm font-semibold text-slate-200">Nội dung Prompt Chi Tiết *</label>
          <textarea id="form-full-prompt" required rows="5" oninput="handlePromptInput()" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-xs sm:text-sm text-slate-100 font-mono" placeholder="Dán prompt chi tiết vào đây..."></textarea>
        </div>
        <div class="space-y-1.5">
          <label class="block text-xs sm:text-sm font-semibold text-slate-200">Thẻ Tag (Tự động hoặc nhập thủ công)</label>
          <input type="text" id="form-tags" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-xs sm:text-sm text-slate-100" placeholder="Thẻ tag cách nhau bằng dấu phẩy...">
        </div>
        <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-800 shrink-0">
          <button type="button" onclick="closeModal()" class="px-4 py-2.5 bg-slate-800 text-slate-300 text-xs sm:text-sm font-medium rounded-xl">Hủy</button>
          <button type="submit" class="px-5 py-2.5 bg-indigo-600 text-white text-xs sm:text-sm font-semibold rounded-xl">Lưu Prompt</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
